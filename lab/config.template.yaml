# CLIProxyAPI config for a lab machine. Rendered by D:\scripts\powershell\Install-CliProxy.ps1
# with `op inject`, so this file holds 1Password references, never secret values.
# Everything not set here keeps the default documented in config.example.yaml.
config-version: 8

server:
  host: "127.0.0.1" # local only; clients on this machine use http://127.0.0.1:8317
  port: 8317

management:
  allow-remote: false
  secret-key: "" # the management key comes from CLIPROXY_MANAGEMENT_KEY at start; none is kept in this file

access:
  api-keys: [] # client keys come from CLIPROXY_API_KEYS at start; none are kept in this file

routing:
  # Fallback only. quota-router answers every pick for the providers it schedules;
  # this strategy applies to the rest and when the plugin is disabled.
  strategy: "round-robin"
  # Off on purpose: a scheduler plugin runs before the built-in affinity selector,
  # so quota-router keeps thread-to-account bindings itself.
  session-affinity: false

upstream:
  claude:
    header-defaults:
      # Treat T3 Code as a native Claude Code client.
      native-entrypoints: ["t3-code"]

oauth:
  # Login tokens are private data: they live with the vaults, not with the service.
  auth-dir: "__DATA_DIR__/auths"

observability:
  usage:
    usage-statistics-enabled: true

plugins:
  enabled: true
  dir: "__SERVICE_DIR__/plugins"
  configs:
    quota-router:
      enabled: true # false restores the built-in scheduler; nothing else changes
      priority: 10
      route: true # false keeps monitoring and the client gate but leaves picks to the host
      data_dir: "__DATA_DIR__/quota-router"
      drain_target: 0.90
      gate_claude_subs: true
      claude_clients: ["claude-cli/", "opencode/"]
      providers: ["claude", "codex"]

# Local llama.cpp (Gemma 4 E4B). Catalog context is the model max (128K);
# Start-LocalModel.ps1 picks a VRAM-safe --ctx-size for the server.
api-keys:
  openai-compatibility:
    - name: "llama-local"
      base-url: "http://127.0.0.1:18234/v1"
      keys:
        - api-key: "local"
      models:
        - name: "gemma-4-e4b-it"
          alias: "gemma-4-e4b-it"
          display-name: "Gemma 4 E4B (local)"
          max-context-length: 131072
          input-modalities: [text]
          output-modalities: [text]
