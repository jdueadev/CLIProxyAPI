[package]
name = "quota-router"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Quota-aware credential scheduler, affinity keeper and usage monitor for CLIProxyAPI (C ABI plugin)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
